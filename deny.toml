# cargo-deny policy for GeekBridge. See docs/supply-chain.md.
#   cargo deny check            (all four sections)
#   cargo deny check licenses   (just one)
# CI (.github/workflows/check.yml, job "supply-chain"): bans/licenses/sources block; advisories are report-only.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Reviewed 2026-11-02 against advisory-db commit of 2026-10-30. All are "unmaintained" notices on
# transitive crates that we cannot replace without changing upstreams; none is a vulnerability.
ignore = [
    # zbus 5.x (desktop call/D-Bus integration, Linux only) pulls these in; upstream is the zbus project.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained notice; transitive via zbus, no vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained notice; transitive via zbus, no vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained notice; transitive via zbus, no vulnerability" },
    # egui 0.31 -> epaint -> ab_glyph -> owned_ttf_parser. Revisit when egui is upgraded.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained notice; transitive via egui/ab_glyph, fonts are our own bundled ones" },
    # Reviewed 2026-11-02 (advisory-db of that day). eframe 0.31 -> egui-winit -> accesskit_winit 0.23 -> accesskit_unix 0.13 ->
    # atspi 0.22 -> zbus-lockstep -> zbus_xml 4.0 -> quick-xml 0.30. zbus_xml 4 pins quick-xml 0.30; the fix (>= 0.41) needs a
    # new accesskit/atspi/zbus_xml line, i.e. an egui upgrade. Linux desktop UI only. The only XML parsed is D-Bus
    # introspection data from the local AT-SPI/session bus (our own session, never network input), so the CPU/memory DoS
    # needs an already-hostile local bus peer. Re-check when egui is upgraded; remove then.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.30 quadratic attribute check via zbus_xml/atspi (accessibility); only local D-Bus introspection XML, fix needs egui upgrade; review by 2027-02-01" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.30 NsReader unbounded namespaces via zbus_xml/atspi (accessibility); only local D-Bus introspection XML, fix needs egui upgrade; review by 2027-02-01" },
    # accesskit_windows 0.24 (Windows accessibility only). Compile-time proc-macro helper, no runtime code or vulnerability.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; compile-time macro only via accesskit_windows, no vulnerability; review by 2027-02-01" },
]

[licenses]
version = 2
# Every licence found in Cargo.lock on 2026-11-02 that is acceptable for a distributed binary.
# Deliberately absent: GPL, AGPL, LGPL, SSPL, EUPL, CC-BY-SA and anything proprietary. Crates that offer
# "... OR LGPL-2.1-or-later" (r-efi) are accepted through their permissive alternative.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",          # Noto Emoji inside epaint_default_fonts
    "Ubuntu-font-1.0",  # Ubuntu Light inside epaint_default_fonts (see docs/licence-decision.md)
]
confidence-threshold = 0.9
# Our own workspace crates (unpublished, `publish = false`, GPL-3.0-or-later) are not checked, whether or not they
# declare a licence yet. GPL stays off the allow list so no third-party GPL crate can slip in.
[licenses.private]
ignore = true

[[licenses.clarify]]
# Dual "(MIT OR Apache-2.0) OR LGPL-2.1-or-later": take the permissive option.
name = "r-efi"
expression = "MIT OR Apache-2.0"
license-files = []

[bans]
multiple-versions = "warn"   # about 30 duplicated crates, mostly winit/egui vs newer stacks; informational
# Our unpublished workspace crates depend on each other by path without a version, which counts as a
# wildcard unless `publish = false` (set) or allow-wildcard-paths applies.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
