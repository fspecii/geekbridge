[package]
name = "geekbridge-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Coverage-guided libFuzzer targets (cargo-fuzz layout). Not part of the main workspace: it needs
# the sanitizer flags, so it builds only through scripts/fuzz.sh. The targets themselves live in
# crates/bridge-fuzz/src/targets.rs and are shared with the deterministic fuzzer run by `cargo test`.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bridge-fuzz = { path = "../crates/bridge-fuzz" }

[workspace]

[profile.release]
debug = 1
[[bin]]
name = "packet_line"
path = "fuzz_targets/packet_line.rs"
test = false
doc = false
bench = false

