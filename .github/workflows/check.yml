name: Cross-platform Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux graphics and private D-Bus test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxrandr-dev libxi-dev libpulse-dev dbus
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests on Linux (mock bus is required)
        if: runner.os == 'Linux'
        env:
          GEEKBRIDGE_REQUIRE_DBUS: '1'
        run: cargo test --workspace --locked
      - name: Emulated call end-to-end (fake modem, private D-Bus; signalling only)
        if: runner.os == 'Linux'
        env:
          GEEKBRIDGE_REQUIRE_DBUS: '1'
        run: scripts/emulate-call.sh fake
      - name: Tests on Windows and macOS
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked
      - name: Build desktop executables
        run: cargo build --release --locked -p bridge-apps -p bridge-service -p bridge-kde -p bridge-calls -p bridge-update
      - name: Windows and macOS call backends compile (their own crates, host OS only)
        if: runner.os != 'Linux'
        run: cargo build --release --locked -p ${{ runner.os == 'Windows' && 'bridge-calls-windows' || 'bridge-calls-macos' }}
      - name: Performance budget (idle service)
        if: runner.os == 'Linux'
        run: scripts/perf-check.sh --window 10

  android:
    name: Android / unit tests, lint, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install Gradle 8.13
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  gradle.zip" | sha256sum -c -
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Install SDK packages and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
      - name: Native libraries (bridge-android for arm64 and x86_64)
        shell: bash
        run: |
          set -euo pipefail
          bin="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar" AR_x86_64_linux_android="$bin/llvm-ar"
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cargo build --release --locked -p bridge-android --target aarch64-linux-android --target x86_64-linux-android
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/release/libgeekbridge_android.so android/app/src/main/jniLibs/arm64-v8a/
          cp target/x86_64-linux-android/release/libgeekbridge_android.so android/app/src/main/jniLibs/x86_64/
          "$bin/llvm-strip" android/app/src/main/jniLibs/*/libgeekbridge_android.so
      - name: Unit tests, lint, debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
