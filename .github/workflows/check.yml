name: Cross-platform Rust checks

# Docs-only changes skip this workflow (the docs.yml link check still runs for them). CHANGELOG.md and
# THIRD_PARTY_NOTICES.md are deliberately not ignored: tests and the notices check read them.
# push is limited to main and the Windows debugging branch: other branches get their run from pull_request, so a
# Dependabot or feature PR no longer runs the whole matrix twice.
on:
  push:
    branches: [main, ci-windows-debug]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'ARCHITECTURE.md'
      - 'SUPPORT.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'ARCHITECTURE.md'
      - 'SUPPORT.md'
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the older run. Nothing here publishes anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Linux graphics and private D-Bus test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxrandr-dev libxi-dev libpulse-dev dbus
      - name: Raise the macOS UDP datagram limit (discovery tests send the 16 KiB identity cap; the default is 9216)
        if: runner.os == 'macOS'
        run: sudo sysctl -w net.inet.udp.maxdgram=65535
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build the whole workspace
        run: cargo build --workspace --locked
      - name: Tests on Linux (mock bus is required)
        if: runner.os == 'Linux'
        env:
          GEEKBRIDGE_REQUIRE_DBUS: '1'
        run: cargo test --workspace --locked --no-fail-fast
      - name: Phone core with the experimental Wi-Fi call audio feature (the debug APK build; clippy and tests)
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p bridge-android --features callwifi --all-targets --locked -- -D warnings
          cargo test -p bridge-android --features callwifi --locked
      - name: Tests on Windows and macOS (Unix-only, D-Bus and Linux-tool tests are cfg-gated or skip with a reason)
        if: runner.os != 'Linux'
        timeout-minutes: 20
        run: cargo test --workspace --locked --no-fail-fast
      - name: Smoke test the built binaries (--version, --help, diagnose on a fresh HOME)
        shell: bash
        run: scripts/smoke-binaries.sh
      - name: Smoke test a live service (private ports, fresh state dir; first real run on Windows and macOS)
        shell: bash
        # Strict on Linux. The Windows and macOS legs report as a failed step but do not fail the job,
        # so one platform-specific surprise does not hide the results of the other checks.
        continue-on-error: ${{ runner.os != 'Linux' }}
        run: scripts/smoke-binaries.sh --live
      - name: Upgrade path (state directories written by old builds open in this build; fixtures, no emulator, about 15 s)
        if: runner.os == 'Linux'
        run: scripts/e2e/upgrade-path.sh
      - name: SBOM generator (CycloneDX shape, completeness against Cargo.lock and Gradle verification, determinism)
        if: runner.os == 'Linux'
        run: scripts/tests/sbom-test.sh
      - name: Real-device kit (report redaction canaries, link-watch transitions; stub ctl, no phone)
        if: runner.os == 'Linux'
        run: scripts/tests/realdevice-kit-test.sh
      - name: Upgrade safety of the real-device scripts (APK signer and version verdict, run-desktop --fresh and --restart; stubs)
        if: runner.os == 'Linux'
        run: |
          scripts/tests/apk-signer-test.sh
          scripts/tests/run-desktop-test.sh
      - name: Emulated call end-to-end (fake modem, private D-Bus; signalling only)
        if: runner.os == 'Linux'
        env:
          GEEKBRIDGE_REQUIRE_DBUS: '1'
        run: scripts/emulate-call.sh fake
      - name: Build desktop executables (release)
        run: cargo build --release --locked -p bridge-apps -p bridge-service -p bridge-kde -p bridge-calls -p bridge-update
      - name: Windows and macOS call backends compile (their own crates, host OS only)
        if: runner.os != 'Linux'
        run: cargo build --release --locked -p ${{ runner.os == 'Windows' && 'bridge-calls-windows' || 'bridge-calls-macos' }}

  perf:
    name: Performance budget (Linux, no emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxrandr-dev libxi-dev libpulse-dev dbus
      - name: Idle service budget (startup, RSS, threads, fds, wakeups, binary size)
        env:
          GB_CI: '1'  # slack on the load-dependent rows for shared runners; binary sizes stay strict
        run: scripts/perf-check.sh --build --window 10

  cross-targets:
    name: Type-check Windows and macOS targets (from Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc,aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy
      - name: cargo check --workspace --all-targets for Windows, macOS arm64 and x86_64 (warnings denied)
        env:
          XCHECK_CLIPPY: '1'
        run: scripts/xcheck.sh

  supply-chain:
    name: Supply chain (cargo-deny, notices)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # bans, licences and sources are deterministic and block. Advisories appear independently of our changes, so that
    # step is report-only (cargo-deny cannot separate direct from transitive crates). See docs/supply-chain.md.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          command: check advisories
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: ${{ !cancelled() }}
        with:
          toolchain: stable
      - name: THIRD_PARTY_NOTICES.md is current
        if: ${{ !cancelled() }}
        run: scripts/gen-notices.sh --check

  android:
    name: Android / unit tests, lint, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # debug builds are versionCode 20000 + commit count (docs/updates.md#dev-channel)
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default 'tools platform-tools' fails ('Failed to find package tools');
          # the packages we need are installed explicitly by sdkmanager below.
          packages: ''
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install SDK packages and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
      - name: Native libraries (bridge-android for arm64 and x86_64)
        shell: bash
        run: |
          set -euo pipefail
          bin="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar" AR_x86_64_linux_android="$bin/llvm-ar"
          # Same profile and linker flags as scripts/android-env.sh and release-local.sh (opt-level z, lld ICF, 16 KiB pages): the library CI
          # ships is the one measured in docs/android-perf.md.
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384 -C link-arg=-Wl,--icf=all"
          cargo build --profile android --locked -p bridge-android --target aarch64-linux-android --target x86_64-linux-android
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/android/libgeekbridge_android.so android/app/src/main/jniLibs/arm64-v8a/
          cp target/x86_64-linux-android/android/libgeekbridge_android.so android/app/src/main/jniLibs/x86_64/
          "$bin/llvm-strip" android/app/src/main/jniLibs/*/libgeekbridge_android.so
          # Android 15+ devices with 16 KiB pages refuse a library whose LOAD segments are aligned to less.
          for so in android/app/src/main/jniLibs/*/libgeekbridge_android.so; do
            "$bin/llvm-readelf" -lW "$so" | awk -v f="$so" '$1=="LOAD" && strtonum($NF) < 16384 { print f ": LOAD alignment " $NF " < 16 KiB"; bad=1 } END { exit bad }'
          done
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Toolchain versions (JDK 17; Gradle 8.13 comes from the checksum-pinned wrapper)
        run: |
          java -version 2>&1 | head -1 | grep -q '"17\.' || { java -version; exit 1; }
          (cd android && ./gradlew --no-daemon --version | grep -q '^Gradle 8\.13') || { echo "wrapper is not Gradle 8.13"; exit 1; }
      - name: Unit tests, lint, debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      # Release (R8 + resource shrinking) universal and arm64-only APKs, unsigned, from the native libraries built above (the CI
      # profile that docs/android-perf.md measures). Sizes are compared to scripts/android-budgets.env; the job fails on overflow.
      - name: Release APK size budgets (universal, arm64-only, classes.dex)
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/universal.apk"
          ./gradlew --no-daemon -Pgb.abis=arm64-v8a :app:assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/arm64.apk"
          cd ..
          scripts/android-size-check.sh --universal "$RUNNER_TEMP/universal.apk" --arm64 "$RUNNER_TEMP/arm64.apk"
      - name: versionCode matches the formula
        run: |
          set -euo pipefail
          scripts/version-code.sh --self-test
          # Debug builds carry the dev-channel code: 20000 + number of commits (docs/updates.md#dev-channel).
          want="$(scripts/version-code.sh --dev)"
          apk="$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)"
          got="$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")"
          [[ "$got" == "$want" ]] || { echo "::error::APK versionCode $got differs from scripts/version-code.sh ($want)"; exit 1; }
      - name: Upload the debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geekbridge-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload Android test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/lint-results-debug.*
            android/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

  # Report only: this job never fails the workflow (continue-on-error) and nothing depends on it. The numbers are
  # targets, not gates (docs/coverage.md). Same SHA pins as the jobs above; cargo-llvm-cov is built from source at an
  # exact version with --locked rather than fetched through a third-party action.
  coverage:
    name: Coverage report (Rust llvm-cov, Android JaCoCo; non-blocking)
    # Not on pull requests: it is the longest job (up to 90 min) and gates nothing.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default 'tools platform-tools' fails ('Failed to find package tools');
          # the packages we need are installed explicitly by sdkmanager below.
          packages: ''
      - name: Linux graphics and private D-Bus test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxrandr-dev libxi-dev libpulse-dev dbus
      - name: Install cargo-llvm-cov (pinned version, locked dependencies)
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Rust coverage
        env:
          GEEKBRIDGE_REQUIRE_DBUS: '1'
        run: scripts/coverage.sh rust | tee coverage-rust.txt
      - name: Android SDK packages for the JVM unit tests
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Android JVM unit-test coverage (JaCoCo, debug unit tests only)
        run: scripts/coverage.sh android | tee coverage-android.txt
      - name: Summary
        if: always()
        run: |
          { echo '### Coverage (targets, not gates: docs/coverage.md)'; echo '```'; tail -n 40 coverage-rust.txt || true; echo; tail -n 40 coverage-android.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-reports
          path: |
            coverage-rust.txt
            coverage-android.txt
            target/llvm-cov/html
            android/app/build/reports/jacoco/jacocoDebugUnitTestReport
          if-no-files-found: ignore
