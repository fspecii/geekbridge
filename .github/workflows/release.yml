name: Release

# OPTIONAL. Official releases are built locally with scripts/release-local.sh and uploaded with
# `gh release create` (docs/builds.md), so nothing here depends on GitHub Actions minutes. This workflow only
# runs when started by hand (Actions tab > Run workflow, choosing the tag as the ref); pushing a tag does not
# start it. The tag must equal [workspace.package] version in Cargo.toml (the single version source).
# Artifact names are what the in-app update checkers look for:
#   geekbridge-<linux|windows|macos>-<x86_64|aarch64>.<tar.gz|zip>, geekbridge-android.apk, geekbridge-sbom.cdx.json (CycloneDX SBOM), SHA256SUMS
#
# Where the release is published: by default this repository. Set the repository variable RELEASE_REPO
# (owner/name) and the secret RELEASES_TOKEN (fine-grained token, Contents: read/write on that repo only) to
# publish to a separate public releases-only repository instead, e.g. while this one is private. The shipped
# apps must then be built with the same repo (GEEKBRIDGE_RELEASE_REPO / -Pgb.releaseRepo; docs/builds.md).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check tag against Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Tag commit must be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not reachable from main; refusing to release"; exit 1; }
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cargo_version="$(awk '/^\[workspace.package\]/{s=1;next} /^\[/{s=0} s && /^version[[:space:]]*=/{gsub(/[" ]/,"",$0); sub(/^version=/,"",$0); print; exit}' Cargo.toml)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "tag '$tag' is not vMAJOR.MINOR.PATCH[-pre]"; exit 1; }
          [[ "v$cargo_version" == "$tag" ]] || { echo "tag $tag does not match Cargo.toml version $cargo_version"; exit 1; }
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          if [[ "$cargo_version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  desktop:
    name: Desktop / ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { name: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, archive: zip }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, archive: zip }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head; the SHA pins the action, `toolchain` picks the compiler)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxrandr-dev libxi-dev libpulse-dev
      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p bridge-apps -p bridge-service
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="stage/geekbridge-${{ matrix.name }}"
          mkdir -p "$out" dist
          ext=""; [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          while IFS= read -r bin; do
            cp "target/${{ matrix.target }}/release/${bin}${ext}" "$out/"
          done < <(grep -v -e '^#' -e '^[[:space:]]*$' scripts/release-binaries.txt | tr -d '\r')
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$out/"
          name="geekbridge-${{ matrix.name }}.${{ matrix.archive }}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              pwsh -Command "Compress-Archive -Path 'stage/geekbridge-${{ matrix.name }}' -DestinationPath 'dist/$name'"
            else
              (cd stage && zip -r -q "../dist/$name" "geekbridge-${{ matrix.name }}")
            fi
          else
            # Sorted entries, fixed mtime (commit time), no gzip header time: docs/reproducible-builds.md
            SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)" bash -c 'source scripts/lib/repro.sh; gb_repro_tar_gz "$1" "$2" "$3"' _ \
              "dist/$name" stage "geekbridge-${{ matrix.name }}"
          fi
          ls -l dist
      # Installers (additive: the archives above are what the in-app update checkers read).
      - name: Installer (Linux .deb + installer tarball)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y librsvg2-bin
          scripts/package-linux.sh --bin-dir "target/${{ matrix.target }}/release" --out dist \
            --version "${{ needs.version.outputs.version }}"
          ls -l dist
      - name: Installer (Windows Inno Setup)
        if: runner.os == 'Windows'
        shell: bash
        env:
          # Git Bash would rewrite the "/D..." switches below into Windows paths.
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          set -euo pipefail
          # Pinned: the install path below is Inno Setup 6's.
          choco install innosetup --version 6.7.1 -y --no-progress
          "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DAppVersion=${{ needs.version.outputs.version }}" \
            "/DBinDir=$(cygpath -w "$PWD/target/${{ matrix.target }}/release")" \
            "/DOutDir=$(cygpath -w "$PWD/dist")" \
            packaging/windows/geekbridge.iss
          ls -l dist
      - name: Installer (macOS .dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install librsvg
          arch="${{ matrix.target }}"; arch="${arch%%-*}"
          packaging/macos/build-app-dmg.sh --bin-dir "target/${{ matrix.target }}/release" --out stage/macos \
            --version "${{ needs.version.outputs.version }}" --arch "$arch"
          cp stage/macos/*.dmg dist/
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    outputs:
      signer_note: ${{ steps.sign.outputs.signer_note }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default 'tools platform-tools' fails ('Failed to find package tools');
          # the packages we need are installed explicitly by sdkmanager below.
          packages: ''
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head; the SHA pins the action, `toolchain` picks the compiler)
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install SDK packages and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
      - name: Build native libraries
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/30.0.16248370"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar" AR_x86_64_linux_android="$bin/llvm-ar"
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cargo build --release --locked -p bridge-android --target aarch64-linux-android --target x86_64-linux-android
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/release/libgeekbridge_android.so android/app/src/main/jniLibs/arm64-v8a/
          cp target/x86_64-linux-android/release/libgeekbridge_android.so android/app/src/main/jniLibs/x86_64/
          "$bin/llvm-strip" android/app/src/main/jniLibs/*/libgeekbridge_android.so
      - name: Test and build unsigned APKs (no secrets in this step)
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          ../scripts/version-code.sh --self-test
          ./gradlew --no-daemon -Pgb.formulaVersionCode=1 :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Sign APK (release keystore if the secrets exist, else debug-signed prerelease)
        id: sign
        shell: bash
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Optional repo variable: lowercase hex SHA-256 of the release certificate (scripts/make-keystore.sh
          # prints it). When set, a release signed by any other key fails.
          ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          cd android
          release_signed=false
          if [[ -n "${ANDROID_KEYSTORE_B64:-}" ]]; then
            ( umask 077; echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks" )
            unsigned="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
            "$bt/zipalign" -f -P 16 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
            # v1 + v2 + v3 (minSdk 26: v2/v3 are what the platform checks; v1 is kept for older tooling).
            "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out ../dist/geekbridge-android.apk "$RUNNER_TEMP/aligned.apk"
            release_signed=true
            echo "Signed with the release keystore."
          else
            if [[ "$PRERELEASE" != "true" ]]; then
              echo "::error::A stable release needs the release keystore secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD; create them with scripts/make-keystore.sh); refusing to publish a debug-signed APK that phones cannot update from or to."
              exit 1
            fi
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/geekbridge-android.apk
            echo "::warning::No release keystore secrets: the APK is DEBUG-signed. Phones cannot update it over an APK signed with a different key."
          fi
          verify="$("$bt/apksigner" verify --verbose --print-certs ../dist/geekbridge-android.apk)"
          want_code="$(../scripts/version-code.sh --code)"
          got_code="$("$bt/aapt2" dump badging ../dist/geekbridge-android.apk | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")"
          [[ "$got_code" == "$want_code" ]] || { echo "::error::signed APK versionCode $got_code differs from scripts/version-code.sh ($want_code)"; exit 1; }
          echo "$verify"
          signer="$(echo "$verify" | sed -n 's/^Signer #1 certificate SHA-256 digest: *//p' | head -n1 | tr 'A-F' 'a-f')"
          [[ "$signer" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::could not read the signer certificate from apksigner"; exit 1; }
          if [[ "$release_signed" == true ]]; then
            echo "$verify" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" || { echo "::error::APK is not v2-signed"; exit 1; }
            echo "$verify" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" || { echo "::error::APK is not v3-signed"; exit 1; }
            want="$(echo "${ANDROID_SIGNER_SHA256:-}" | tr -d ': ' | tr 'A-F' 'a-f')"
            if [[ -n "$want" && "$signer" != "$want" ]]; then
              echo "::error::signer SHA-256 $signer does not match the repository variable ANDROID_SIGNER_SHA256 ($want): wrong keystore. Phones that have the app installed would refuse this update."
              exit 1
            fi
            [[ -n "$want" ]] || echo "::warning::ANDROID_SIGNER_SHA256 is not set, so the signing key is not pinned. Set it to $signer."
            echo "signer_note=Android APK signer certificate SHA-256: \`$signer\`" >> "${GITHUB_OUTPUT:-/dev/null}"
          else
            echo "signer_note=Android APK is DEBUG-signed (prerelease only; not updatable from or to a release build). Signer SHA-256: \`$signer\`" >> "${GITHUB_OUTPUT:-/dev/null}"
          fi
          echo "signer=$signer" >> "${GITHUB_OUTPUT:-/dev/null}"
      - name: Remove the keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: dist/geekbridge-android.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head; the SHA pins the action, `toolchain` picks the compiler)
        with:
          toolchain: stable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: SBOM (CycloneDX 1.5; timestamp = commit time, so it is reproducible)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)" scripts/gen-sbom.sh --out artifacts/geekbridge-sbom.cdx.json
      - name: SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          ls -l
          for f in geekbridge-linux-x86_64.tar.gz geekbridge-windows-x86_64.zip geekbridge-macos-aarch64.zip \
                   geekbridge-macos-x86_64.zip geekbridge-android.apk geekbridge-sbom.cdx.json; do
            [[ -s "$f" ]] || { echo "missing or empty artifact: $f"; exit 1; }
          done
          sha256sum -- geekbridge-* $(compgen -G "geekbridge_*" || true) | tee SHA256SUMS
      - name: Create release
        env:
          DEFAULT_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          SIGNER_NOTE: ${{ needs.android.outputs.signer_note }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${RELEASE_REPO:-$GITHUB_REPOSITORY}"
          [[ "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::RELEASE_REPO must be owner/name"; exit 1; }
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          if [[ "$repo" == "$GITHUB_REPOSITORY" ]]; then
            export GH_TOKEN="$DEFAULT_TOKEN"
            flags+=(--verify-tag --generate-notes --notes "$SIGNER_NOTE")
          else
            # Another repository: the job token cannot write there. The tag does not exist there, so gh
            # creates it at the default branch head (the releases repo needs at least one commit).
            [[ -n "$RELEASES_TOKEN" ]] || { echo "::error::RELEASE_REPO is set but the RELEASES_TOKEN secret is missing"; exit 1; }
            export GH_TOKEN="$RELEASES_TOKEN"
            flags+=(--notes "GeekBridge ${GITHUB_REF_NAME#v} (built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}). ${SIGNER_NOTE}")
          fi
          echo "Publishing $GITHUB_REF_NAME to $repo"
          # Draft first, publish once every asset is attached: the in-app updaters read
          # releases/latest and must never see a release that has no SHA256SUMS yet.
          gh release create "$GITHUB_REF_NAME" artifacts/* --draft \
            --repo "$repo" --title "GeekBridge ${GITHUB_REF_NAME#v}" "${flags[@]}"
          gh release edit "$GITHUB_REF_NAME" --repo "$repo" --draft=false
