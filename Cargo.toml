[workspace]
members = ["crates/bridge-callwifi", "crates/bridge-core", "crates/bridge-service", "crates/bridge-apps", "crates/bridge-i18n", "crates/bridge-kde", "crates/bridge-calls", "crates/bridge-android", "crates/bridge-calls-windows", "crates/bridge-calls-macos", "crates/bridge-phone-sim", "crates/bridge-update", "crates/bridge-chaos", "crates/bridge-fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/fspecii/geekbridge"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bridge-core = { path = "crates/bridge-core" }

[profile.dev]
debug = 1

# `cargo test` only: the deterministic fuzz pass (bridge-fuzz/tests/deterministic.rs, 2000 inputs per target)
# took 114 s unoptimised, the slowest test in the workspace and a big part of the Windows CI test step.
# Optimising just the fuzz harness and the protocol crate it exercises brings it down while keeping debug
# assertions and overflow checks on; ordinary `cargo build`/`cargo run` are unaffected.
[profile.test.package.bridge-fuzz]
opt-level = 2
[profile.test.package.bridge-core]
opt-level = 2
[profile.test.package.bridge-kde]
opt-level = 2
[profile.test.package.bridge-android]
opt-level = 2
[profile.test.package.bridge-update]
opt-level = 2

# Desktop release builds (geekbridge-service, geekbridge-ctl and the egui apps). Measured on
# bridge-service + bridge-apps, x86_64 Linux (docs/performance.md has the table): the defaults gave a
# 10.7 MB service binary; fat LTO + one codegen unit + stripped symbols + opt-level "s" gives 4.3 MB
# and a lower idle RSS, at the cost of a slower release build. The work is I/O bound (sockets, small
# JSON frames, TLS via ring's assembly), so opt-level "s" costs nothing measurable.
# panic stays "unwind" on purpose: tokio contains a panic in one link or request task, while
# panic = "abort" would let one bad packet that trips a bug kill the whole service.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Cold dependencies at opt-level "z": D-Bus (zbus, zvariant, zbus_xml: tray, call backend, probes), certificate
# generation/parsing (rcgen, x509-parser) and the root-store table run once per start or per user action, never
# per frame or per packet. Measured on the service, x86_64 Linux: 7 554 072 -> 7 519 896 B (-34 kB).
# Everything on the data path (ring, sha2, tokio, serde_json, rustls, opus-pure, our own crates) stays "s":
# widening "z" to all dependencies saved less (7 527 192 B), so the list is deliberately short.
[profile.release.package.zbus]
opt-level = "z"
[profile.release.package.zvariant]
opt-level = "z"
[profile.release.package.zbus_xml]
opt-level = "z"
[profile.release.package.x509-parser]
opt-level = "z"
[profile.release.package.rcgen]
opt-level = "z"
[profile.release.package.webpki-roots]
opt-level = "z"

# The protocol crate at "z" too: it is wire types, view models and text rules, and its serde derives (about 40
# Deserialize impls, instantiated for every reply type) were the largest block of geekbridge-ctl. Measured on
# 2026-11-06, x86_64 Linux: ctl 1 781 328 -> 1 723 848 B (-57.5 kB), service 7 512 088 -> 7 511 704 B (-0.4 kB).
# serde_json itself stays "s" (at "z" the service grew +24 kB for -1.4 kB on the ctl), and so does bridge-update
# (-7.7 kB on the service, +0.3 kB on the ctl, left alone: it is the self-update download path).
[profile.release.package.bridge-core]
opt-level = "z"

# Size-optimised profile for the Android shared library (scripts/build-android.sh uses it). panic stays
# "unwind": the JNI boundary (jni_export.rs, dispatch.rs) catches panics and turns them into error replies;
# with panic=abort one bad request would kill the whole app process instead.
[profile.android]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
