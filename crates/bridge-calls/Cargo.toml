[package]
name = "bridge-calls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Bluetooth HFP call-control backends (Linux: PipeWire org.pipewire.Telephony; other platforms: explicit unavailable backend)"

[[bin]]
name = "geekbridge-call-probe"
path = "src/bin/geekbridge-call-probe.rs"

[dependencies]
bridge-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"

# The D-Bus adapter is Linux-only. Windows/macOS build the explicit unavailable backend and
# never link a D-Bus stack or spawn Linux commands.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
zbus_xml = "6"
async-io = "2"
futures-lite = "2"
# Call-audio routing talks to PulseAudio/pipewire-pulse through `pactl`/`parec` at call time, not
# an in-process libpulse (that would add ~2.2 MB idle RSS to the service; docs/performance.md).

[dev-dependencies]
tempfile = "3"
