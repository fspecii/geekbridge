[package]
name = "bridge-kde"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "KDE Connect protocol 8 TCP/TLS transport with explicit, certificate-pinned pairing"

[lib]
name = "bridge_kde"

[[bin]]
name = "geekbridge-pair"
path = "src/bin/geekbridge-pair.rs"

[dependencies]
bridge-core.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Win32 ACL / handle / locking APIs for src/fsutil/windows.rs. Target-specific:
# never built for Linux, macOS or Android.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
