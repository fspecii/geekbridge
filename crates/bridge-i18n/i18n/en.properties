# Settings -> Privacy: what banners and the incoming-call card may show.
privacy.section = Privacy
privacy.intro = Choose what appears on screen, where others may see it. Changes apply at once.
privacy.checking = Checking the GeekBridge service…
privacy.unexpected = The service answered unexpectedly.
privacy.on = on
privacy.off = off
privacy.a11y.state = Currently {state}
privacy.message_text = Show message text in notifications
privacy.message_text.detail = Off: a new-message banner names the sender only. On: it also shows the text.
privacy.caller_number = Show caller number on the call card
privacy.caller_number.detail = Off: the incoming-call card shows the contact's name, or "Unknown caller", never the number.
privacy.phone_notification_text = Show phone notification text
privacy.phone_notification_text.detail = Off: a mirrored phone notification shows the app and title only. On: it also shows the text.
privacy.respect_dnd = Respect Do Not Disturb for incoming calls
privacy.respect_dnd.detail = Off: a ringing call always shows the card. On: while this computer is in Do Not Disturb the card and the ringing banner stay away, and you are not told about the call except by the tray icon and Recents. Works with mako, dunst, SwayNotificationCenter, KDE and GNOME.
privacy.respect_dnd.detail_other = Not supported on this system: Windows Focus Assist and macOS Focus cannot be read without special permission, so calls always show the card.
privacy.forced.sms_env = Fixed on by the GEEKBRIDGE_SMS_NOTIFY_CONTENT environment variable. Unset it and restart the service to change this here.
privacy.forced.sms_file = Fixed on by the sms-notify-content file in the state folder. Delete the file to change this here.
privacy.forced.overlay_env = Fixed by the GEEKBRIDGE_CALL_OVERLAY environment variable. Unset it and restart the service to change this here.
privacy.forced.overlay_file = Fixed by the call-overlay file in the state folder. Delete the file to change this here.

