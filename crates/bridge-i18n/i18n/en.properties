# Why a paired phone is not connected (bridge_core::why_disconnected); one sentence and one fix per reason code
why.try = Try: {fix}
why.last_heard = Last heard {age}
why.computer_offline = This computer has no network connection.
why.computer_offline.fix = Connect this computer to Wi-Fi or Ethernet.
why.not_listening = GeekBridge is not listening for phones on this computer.
why.not_listening.fix = Quit KDE Connect or GSConnect if it is running, then restart GeekBridge.
why.paused_by_user = You disconnected this phone.
why.paused_by_user.fix = Open the GeekBridge app on the phone, or connect it from here.
why.pairing_lost = The phone no longer trusts this computer.
why.pairing_lost.fix = Pair the phone with this computer again.
why.firewall_blocking = This computer's firewall is blocking the phone.
why.firewall_blocking.fix = Allow TCP and UDP 1716-1764 on your LAN (run geekbridge-ctl firewall).
why.reconnecting = Trying to reach the phone again.
why.reconnecting.fix = Keep the GeekBridge app open on the phone, on the same Wi-Fi.
why.gave_up = The phone is nearby but would not connect.
why.gave_up.fix = Check the firewall (geekbridge-ctl doctor), or open the app on the phone to retry.
why.link_timed_out = The connection stopped answering.
why.link_timed_out.fix = Wake the phone and open the GeekBridge app; allow it to run in the background.
why.different_network = The phone was last seen on a different network.
why.different_network.fix = Put the phone and this computer on the same Wi-Fi.
why.phone_silent = The phone is not announcing itself.
why.phone_silent.fix = Wake the phone, join the same Wi-Fi and open the GeekBridge app (Stay connected on).
why.not_seen_yet = This computer has not heard from the phone yet.
why.not_seen_yet.fix = Open the GeekBridge app on the phone, on the same Wi-Fi.
why.unknown = The phone is not connected.
why.unknown.fix = Open the GeekBridge app on the phone, then run geekbridge-ctl doctor.

