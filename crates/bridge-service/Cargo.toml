[package]
name = "bridge-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "geekbridge-service"
path = "src/main.rs"

[[bin]]
name = "geekbridge-ctl"
path = "src/bin/geekbridge-ctl.rs"

[dependencies]
bridge-core.workspace = true
bridge-i18n = { path = "../bridge-i18n" }
bridge-kde = { path = "../bridge-kde" }
bridge-calls = { path = "../bridge-calls" }
bridge-calls-windows = { path = "../bridge-calls-windows" }
bridge-update = { path = "../bridge-update" }
serde.workspace = true
serde_json.workspace = true
getrandom = "0.3"
base64 = "0.23"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }

# Windows: the global "paste from phone" hotkey (RegisterHotKey) and the notification-area icon
# (Shell_NotifyIconW, tray/windows.rs). Pure Rust, nothing to link.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

# Interface list for the pairing QR (getifaddrs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux tray: a StatusNotifierItem on the zbus the call backend already links (no new crates).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
futures-lite = "2"

# macOS: the menu-bar item (tray/macos.rs). Generated bindings, type-checked without an Apple SDK.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSPasteboard", "NSMenu", "NSMenuItem", "NSImage", "NSButton", "NSControl", "NSView", "NSResponder"] }

[dev-dependencies]
tempfile = "3"
bridge-i18n = { path = "../bridge-i18n", features = ["force-english"] }
bridge-chaos = { path = "../bridge-chaos" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }

