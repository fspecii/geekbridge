[package]
name = "bridge-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "geekbridge-service"
path = "src/main.rs"

[[bin]]
name = "geekbridge-ctl"
path = "src/bin/geekbridge-ctl.rs"

[dependencies]
bridge-core.workspace = true
bridge-kde = { path = "../bridge-kde" }
bridge-calls = { path = "../bridge-calls" }
bridge-calls-windows = { path = "../bridge-calls-windows" }
bridge-update = { path = "../bridge-update" }
serde.workspace = true
serde_json.workspace = true
getrandom = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }

# Windows: the global "paste from phone" hotkey (RegisterHotKey). Pure Rust, nothing to link.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile = "3"
bridge-chaos = { path = "../bridge-chaos" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
