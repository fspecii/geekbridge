[package]
name = "bridge-phone-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Simulated phone for end-to-end call testing: serves org.pipewire.Telephony on D-Bus and drives an Android emulator modem (no Bluetooth)"

[[bin]]
name = "geekbridge-phone-sim"
path = "src/bin/geekbridge-phone-sim.rs"

[[bin]]
name = "geekbridge-call-e2e"
path = "src/bin/geekbridge-call-e2e.rs"

[dependencies]
thiserror = "2"
serde_json.workspace = true
bridge-core.workspace = true
bridge-calls = { path = "../bridge-calls" }
bridge-service = { path = "../bridge-service" }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
blocking = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
bridge-kde = { path = "../bridge-kde" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
