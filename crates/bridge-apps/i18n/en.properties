# GeekBridge desktop strings: English is the source language.
# Format: key = value. {name} is a placeholder, \n a newline, {{ and }} literal braces.
# Plurals: key.one / key.other (plus zero, two, few, many where the language needs them); {n} is the count.
# Do not translate product names: GeekBridge, KDE Connect. See docs/translating.md.

# Settings > Report a problem
report.section = Report a problem
report.intro = Builds a bug report from the redacted diagnostics, shows it to you here, and opens a pre-filled GitHub form in your browser. Nothing is sent automatically.
report.review = Review report
report.collecting = Collecting…
report.preview_title = This is exactly what will be put in the form:
report.nothing_sent = Nothing is sent by GeekBridge. Your browser loads the form, and GitHub receives it only if you press Submit there.
report.open = Open in browser
report.copy = Copy
report.close = Close
report.truncated = Shortened to fit a link; Copy keeps what is shown here, `geekbridge-ctl diagnose` prints everything.
report.opened = Opened your browser. Review the form there before you submit it.
report.copied = Copied.
report.no_browser = No browser could be opened. The report is on your clipboard; open this link yourself:\n{url}

