[package]
name = "bridge-apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bridge-core.workspace = true
bridge-i18n = { path = "../bridge-i18n" }
qrcode = { version = "0.14", default-features = false }
eframe = { version = "0.31.1", default-features = false, features = ["glow", "wayland", "x11"] }

[features]
# Screen-reader support on the desktop (AT-SPI on Linux, UIA on Windows, NSAccessibility on macOS)
# through egui's AccessKit integration. On by default; build with `--no-default-features` to drop it
# (see docs/accessibility.md for the measured cost).
default = ["accesskit"]
accesskit = ["eframe/accesskit"]
# Counting global allocator + GEEKBRIDGE_MEMSTATS=1 reporter, for memory work only (docs/performance.md).
memstats = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time"] }

[dependencies.bridge-kde]
path = "../bridge-kde"

[dependencies.zeroize]
version = "1"

[dev-dependencies]
tempfile = "3"
bridge-i18n = { path = "../bridge-i18n", features = ["force-english"] }
# Decodes the drawn QR code in a test, so "the code on screen scans" is checked, not assumed.
rqrr = "0.11"
