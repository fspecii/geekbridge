[package]
name = "bridge-apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
bridge-core.workspace = true
serde_json.workspace = true
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time"] }

[dependencies.bridge-kde]
path = "../bridge-kde"

[dependencies.zeroize]
version = "1"

[dev-dependencies]
tempfile = "3"
