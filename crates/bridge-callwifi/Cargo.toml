[package]
name = "bridge-callwifi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "EXPERIMENTAL call audio over the GeekBridge link (geekbridge.callaudio.*): wire format, three-consent gate, Opus 16 kHz mono, jitter buffer and the framing to the shell-uid helper. Off by default; see docs/design/call-audio-over-wifi.md"

[dependencies]
serde_json.workspace = true
base64 = "0.22"
# Pure-Rust Opus (RFC 6716), BSD-3-Clause, no C, no build script, no dependencies. Evaluated in
# docs/reports/call-audio-wifi-prototype.md (size, speed, licence).
opus-pure = "=0.2.2"
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "rt", "macros"] }
